    model-dir: # optional, default is model
    # Package to start the export from, as qualified name (e.g. Documentation::arc42, with or without the root model name) or as xmi:id. Empty exports from the model root.
    start-package: # optional, default is 
    # Directory where the markdown tree will be written. Created if missing.
    output-dir: 
